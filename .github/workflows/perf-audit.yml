name: Performance Regression Pipeline

on:
  schedule:
    # Wakes up at 18 minutes past 11 PM UTC, every 3 days
    # This translates to 7:18 AM Singapore Time, rolling every third day
    - cron: '18 23 */3 * *'
  workflow_dispatch:

jobs:
  qa-benchmarking:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Initialize Environment
        uses: actions/checkout@v4

      - name: Calculate Telemetry Variance
        run: |
          # 15% chance to skip (highly consistent when the 3-day window arrives)
          if [ $((RANDOM % 100)) -lt 15 ]; then
            echo "Telemetry window deferred to prevent cluster grouping."
            exit 0
          fi

          TARGET_FILE="telemetry.env"
          
          # Generate structured key-value configurations typical of environment properties
          echo "SYS_NODE_ID=$RANDOM" >> "$TARGET_FILE"
          echo "LATENCY_MS=$((RANDOM % 120 + 10))" >> "$TARGET_FILE"
          echo "LAST_CHECKED_EPOCH=$(date +%s)" >> "$TARGET_FILE"
          echo "STATUS_HEALTHY=true" >> "$TARGET_FILE"

          git config --global user.name "yvonnechia124"
          git config --global user.email "yvonnechia124@gmail.com"

          # QA / Testing vocabulary for a completely unique commit history log
          MESSAGES=(
            "test: log performance telemetry metrics"
            "ci: update automated regression environment bounds"
            "test: record end-to-end load benchmark vectors"
            "chore: rotation of system diagnostic metrics"
          )
          MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

          git add "$TARGET_FILE"
          git commit -m "$MSG"
          git push
